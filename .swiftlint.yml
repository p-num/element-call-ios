disabled_rules:
  - trailing_whitespace
  - unused_setter_value
  - redundant_discardable_let
  - identifier_name
  - void_function_in_ternary

opt_in_rules:
  - force_unwrapping
  - private_action
  - explicit_init
  - shorthand_optional_binding
  - trailing_closure

included:
  - Sources
  - Tests
  # The example harness. Linted like everything else: it is the one place that consumes the package
  # the way a host does, so a boundary it can cross is a boundary a host can cross.
  - Example
excluded:
  - "Sources/*/Generated"
  - "Tests/*/Generated"

line_length:
  warning: 250
  error: 1000

file_length:
  warning: 2000

type_name:
  min_length: 3
  max_length:
    warning: 150
    error: 1000

type_body_length:
  warning: 1000
  error: 1000

function_body_length:
  warning: 100
  error: 100

function_parameter_count:
  warning: 10
  error: 10

cyclomatic_complexity:
  ignores_case_statements: true

nesting:
  type_level:
    warning: 5

custom_rules:
  vstack_spacing:
    regex: "(?-s)VStack((?!spacing:).)*\\s*\\{"
    match_kinds: identifier
    message: "Please use explicit spacing in VStacks."
    severity: warning

  hstack_spacing:
    regex: "(?-s)HStack((?!spacing:).)*\\s*\\{"
    match_kinds: identifier
    message: "Please use explicit spacing in HStacks."
    severity: warning

  # This package has no app logger. Everything goes through the injected
  # ElementCallLoggingProtocol port so the host decides where logs land.
  print_deprecation:
    regex: "\\b(print)\\b"
    match_kinds: identifier
    message: "The injected ElementCallLoggingProtocol port should be used instead of print()"
    severity: error

  print_ln_deprecation:
    regex: "\\b(println)\\b"
    match_kinds: identifier
    message: "The injected ElementCallLoggingProtocol port should be used instead of println()"
    severity: error

  os_log_deprecation:
    regex: "\\b(os_log)\\b"
    match_kinds: identifier
    message: "The injected ElementCallLoggingProtocol port should be used instead of os_log()"
    severity: error

  # The design system stays on the host's side of the boundary: see the theme
  # and icon ports. A Compound import here would give a Pro customer a call
  # screen that ignores their brand colour.
  no_compound_dependency:
    regex: "import Compound$"
    message: "The Compound component library must not be imported: its colours live on a shared instance the host re-brands at runtime. Take colours through ElementCallThemeProtocol and icons through ElementCallIconRenderingProtocol. CompoundDesignTokens is fine."
    severity: error

  # The package carries no Matrix SDK at all: the host implements ElementCallMatrixBackendProtocol over
  # its own, so a host's SDK bump never waits on a release of ours. Only the example's reference
  # backend, and its tests, speak to the SDK.
  no_matrix_sdk_dependency:
    regex: "import MatrixRustSDK"
    message: "The package must not import MatrixRustSDK: the host implements ElementCallMatrixBackendProtocol. Only the example's reference backend may."
    severity: error
    excluded: "Example/(ElementCallExample/Matrix|ElementCallExampleTests)/.*"

  # The Swift API Design Guidelines, which every name generated from Rust breaks: the bindings spell
  # `roomId`, `contentJson` and `delayMs`, and a name copied from them reads as ours. Only names we
  # declare are checked, so passing a value to a generated label (`roomId: roomID`) is fine. The
  # excluded files conform to generated protocols, whose requirement names are not ours to choose.
  swift_api_naming:
    regex: "\\b(let|var|func|case)\\s+[a-z][A-Za-z0-9]*(Id|Ids|Json|Url|Urls|Uri|Sdk|Ffi|Rtc|Ms|Secs)\\b"
    match_kinds: [keyword, identifier]
    message: "Follow the Swift API Design Guidelines: initialisms take uniform case (ID, JSON, URL, SDK, RTC) and a unit belongs in the type (Duration, Date), not the name (Ms, Secs)."
    severity: error
    excluded: "(Sources/ElementCallKit/(Backend/MatrixBackendAdapter|Harness/MatrixRTCScripted[A-Za-z]*)|Tests/ElementCallTests/Support/FakeRTCCall)\\.swift"

  swift_api_type_naming:
    regex: "\\b(struct|class|enum|protocol|actor|typealias)\\s+[A-Z][A-Za-z0-9]*?(Id|Json|Url|Sdk|Ffi|Rtc)(?![a-z])"
    match_kinds: [keyword, identifier]
    message: "Follow the Swift API Design Guidelines: initialisms take uniform case (ID, JSON, URL, SDK, RTC)."
    severity: error
