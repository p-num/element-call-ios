changelog:
  # Excluded before anything is categorised, so a pr-task pull request lands under no heading at all
  # -- not even the "*" catch-all under Others. This is the label for work that changes nothing a
  # host could observe: CI plumbing, test-only churn, a repository chore. It is deliberately the
  # only way to keep a merged pull request out of the notes, so "no entry" is a labelled decision a
  # reviewer can see rather than the silent result of leaving the label off.
  exclude:
    labels:
      - pr-task

  categories:
    - title: ✨ Features
      labels:
        - pr-feature
    - title: 🙌 Improvements
      labels:
        - pr-change
    - title: 🐛 Bugfixes
      labels:
        - pr-bugfix
    # This package's public surface is the ports and the accessibility identifiers, and hosts pin it
    # by exact version, so a breaking change needs to be loud in the release notes.
    - title: ⚠️ API Changes
      labels:
        - pr-api
    - title: 🦻 Accessibility
      labels:
        - pr-a11y
    - title: 🧱 Build
      labels:
        - pr-build
    - title: 📄 Documentation
      labels:
        - pr-doc
    - title: 🗣 Translations
      labels:
        - pr-i18n
    - title: 🚧 In development 🚧
      labels:
        - pr-wip

    # No pr-element-pro: this package has no enterprise variant.

    - title: Others
      labels:
        - pr-misc
        - "*"
