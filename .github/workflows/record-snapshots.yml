name: Record Snapshots

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  record:
    # Label-triggered, and never on a fork: this pushes a commit to the pull request branch.
    if: github.event.label.name == 'record-snapshots' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    env:
      XCODE_APP: /Applications/Xcode_26.5.app
      SIMULATOR_NAME: iPhone SE (3rd generation)
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5

    steps:
      - name: Remove the label
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'record-snapshots'
            })

      # persist-credentials stays on: the last step pushes the recorded images back to the branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Configure Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Install tools
        run: brew install sourcery

      - name: Generate preview tests
        working-directory: Tools/Sourcery
        run: sourcery --config PreviewTestsConfig.yml

      - name: Create the snapshot simulator
        id: simulator
        run: |
          udid=$(xcrun simctl create "ElementCall Snapshots" "$SIMULATOR_NAME" "$SIMULATOR_RUNTIME")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # The marker file is how the harness is told to overwrite what no longer matches; see the
      # comment on `recordMarkerURL`, which explains why RECORD_FAILURES=true on this command line
      # reached nothing and this job used to record new images only.
      #
      # Recording only what fails, rather than deleting the directory and recording everything, is
      # what keeps the commit to the images that actually changed. Byte-identical re-encoding is not
      # guaranteed across Xcode versions, so a wholesale re-record rewrites all 5.5 MB of images
      # whenever the toolchain moves -- which buries the handful a reviewer needs to look at, and,
      # now that they are ordinary blobs rather than LFS pointers, puts every one of those bytes
      # into the repository permanently.
      - name: Re-record
        continue-on-error: true
        run: |
          touch Tests/ElementCallTests/.record-snapshots
          xcodebuild test \
            -scheme ElementCall-Package \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -testLanguage en -testRegion GB \
            OTHER_LDFLAGS='$(inherited) -ObjC'
          rm -f Tests/ElementCallTests/.record-snapshots

      - name: Commit the images
        run: |
          git config user.name "ElementBot"
          git config user.email "android@element.io"
          git add -A Tests/ElementCallTests/__Snapshots__/
          if git diff --cached --quiet; then
            echo "No snapshot changes detected."
          else
            git commit -m "Record preview snapshots"
            git push origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }}
          fi
