name: Tests

on:
  workflow_dispatch:
  push:
    # release/** as well as main: a release branch's tip is a commit nobody has tested otherwise,
    # and release.yml refuses to tag a commit without a green run here.
    branches: [main, release/**]
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

# Workflow-level so the package tests and the UI test shards share one copy.
env:
  # Snapshot references are pinned to one device and OS: font rendering differs otherwise.
  # These three must match Tests/ElementCallTests/Support/SnapshotEnvironment.swift, which the
  # harness reads, and it fails loudly rather than silently if they drift.
  XCODE_APP: /Applications/Xcode_26.5.app
  SIMULATOR_NAME: iPhone SE (3rd generation)
  SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
  SIMULATOR_LABEL: ElementCall Snapshots
  # Bump to discard the build caches below. The only lever if a restored build ever looks
  # wrong, and cheaper to reach for than reasoning about whether it is.
  CACHE_VERSION: '1'

jobs:
  # Which files changed, and can any of them alter what the tests job does? Ten seconds on Linux to
  # decide whether to spend ten minutes on macOS.
  #
  # This deliberately does NOT use a trigger-level `paths:` filter, which is what element-x-ios does
  # in compound-ios.yml. A trigger filter creates no workflow run at all, and scripts/release.sh
  # refuses to tag a commit unless a run of THIS workflow succeeded for it -- so a docs-only commit
  # would leave nothing to find and become unreleasable. A cheap job that always runs keeps the run
  # in existence and green, with the expensive job skipped inside it. Please do not "tidy" this into
  # a paths: filter.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}

    steps:
      # Needed for push events, where the filter compares refs with git. Full history because the
      # base can be an older commit on the default branch; the repository is a few megabytes, so
      # this is cheap.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # `some-with-excludes` is not optional. The default, `some`, asks whether *some* file
          # matches *some* pattern -- and every file matches `**`, so `relevant` would be true for a
          # docs-only change and nothing would ever be skipped. This quantifier is the one that means
          # "matches a pattern and no negated pattern".
          predicate-quantifier: some-with-excludes
          # A blocklist, on purpose: `**` includes everything, and the exclusions below are the paths
          # known to be unable to change what the tests job does. Anything unrecognised therefore
          # counts as relevant, so a newly added load-bearing file errs towards being tested, where an
          # allowlist would silently stop testing it.
          #
          # Note what is NOT excluded, and must not be: Sources, Tests, Tools (Sourcery drives the
          # generated-test staleness check), Package.swift, Package.resolved, .swiftformat,
          # .swiftlint.yml, .gitattributes (it is where a checkout filter would reappear if anyone
          # added one back) and this workflow itself.
          filters: |
            relevant:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!LICENSE-*'
              - '!screenshot.png'
              - '!.editorconfig'
              - '!.gitignore'
              - '!codecov.yml'
              - '!renovate.json'
              - '!.swiftpm/**'
              - '!scripts/**'
              - '!.github/CODEOWNERS'
              - '!.github/PULL_REQUEST_TEMPLATE.md'
              - '!.github/release.yml'
              - '!.github/workflows/release.yml'
              - '!.github/workflows/record-snapshots.yml'

  tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && format('tests-main-{0}', github.sha) || format('tests-{0}', github.ref) }}
      cancel-in-progress: true

    steps:
      # A plain checkout. The snapshot references are ordinary blobs in the repository, so there
      # is nothing to fetch separately and no filter to run -- see CONTRIBUTING.md for why they must
      # not go back into Git LFS.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      # Nothing used to be cached, so every run re-downloaded the media xcframeworks and recompiled
      # every dependency -- swift-syntax above all, which snapshot-testing's macros pull in and
      # which is the slowest thing in the build. Measured on a green run: 5m32s building against
      # 24s of tests, in a 6m23s job. The tests were never what made this slow.
      #
      # Xcode's default DerivedData location, deliberately, rather than relocating it with
      # -derivedDataPath or -clonedSourcePackagesDirPath. Both of those break this package: against
      # a directory that does not exist yet -- which is every cache miss -- the first xcodebuild
      # invocation fails scheme discovery outright with "does not contain a scheme named
      # ElementCall-Package", and a second one then finds no test bundle to run. Caching where
      # Xcode already puts things needs no flags and cannot break the uncached path.
      #
      # Keyed on Package.resolved and nothing else. Keying on a hash of the sources would look more
      # correct and would be much worse: this directory is a few gigabytes, a repository gets 10 GB
      # of cache with least-recently-used eviction, so a fresh entry per push would exhaust the
      # quota within a handful of commits and evict the entry it just wrote. Keyed this way there is
      # one entry per dependency set, written the first time it is seen.
      #
      # That means it goes stale, since a cache hit does not write. It is still worth having: what
      # it carries is the dependencies, which change only when Package.resolved does. Our own five
      # modules are small and rebuild anyway.
      #
      # Whether this is a net win is not yet established, and the entry is big enough that it might
      # not be: 3.6 GB, split evenly between the package checkouts -- 1.4 GB of that the media
      # xcframeworks -- and the build products, which are mostly the static libwebrtc. Neither half
      # is prunable without losing the thing being cached. Locally the same build goes from 90s
      # cold to 25s warm, but a hosted runner has to move those gigabytes over the network first,
      # and macOS runners are slow at it. If the job does not get faster, delete this step rather
      # than tuning it.
      - name: Cache build products
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: build-${{ env.CACHE_VERSION }}-${{ env.XCODE_APP }}-${{ hashFiles('Package.resolved') }}

      - name: Install tools
        run: brew install sourcery swiftformat swiftlint

      # The package must never reach for the host application's world. SwiftLint carries the rules
      # that enforce it, at error severity, so this failing is the boundary breaking rather than a
      # style nit. Not --strict: the media layer arrived from the spike with sixteen force-unwrap
      # and large-tuple warnings that element-x-ios also carries, and promoting those to errors is
      # separate work from standing up continuous integration.
      - name: Lint
        run: |
          swiftformat --lint .
          swiftlint

      # Regenerated rather than trusted, then checked for drift: the committed file is what a
      # developer reads in a diff, so it must not go stale.
      - name: Generate preview tests
        working-directory: Tools/Sourcery
        run: sourcery --config PreviewTestsConfig.yml

      - name: Fail if the generated tests are stale
        run: git diff --exit-code -- Tests/ElementCallTests/GeneratedPreviewTests.swift

      - name: Create the snapshot simulator
        id: simulator
        run: |
          udid=$(xcrun simctl create "$SIMULATOR_LABEL" "$SIMULATOR_NAME" "$SIMULATOR_RUNTIME")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Two flags that are not optional, both of which fail in confusing ways when missed.
      #
      # `-ObjC` keeps libwebrtc's Objective-C categories from being dead-stripped out of the static
      # archive. Library targets never link, so a plain build passes without it and only the test
      # bundle dies, on launch, with an unrecognised selector.
      #
      # The destination is a concrete arm64 simulator by id. A generic one also builds Intel, for
      # which the media xcframework has no slice, and EXCLUDED_ARCHS on the command line does not
      # reach the targets SwiftPM generates.
      - name: Run tests
        run: |
          set -o pipefail && xcodebuild test \
            -scheme ElementCall-Package \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -testLanguage en -testRegion GB \
            OTHER_LDFLAGS='$(inherited) -ObjC' \
            -resultBundlePath Logs/ElementCallTests.xcresult \
            | xcbeautify --renderer github-actions

      - name: Zip artifacts
        if: failure()
        run: |
          for bundle in Logs/*.xcresult; do
            [ -e "$bundle" ] && zip -r "$bundle.zip" "$bundle/"
          done

      - name: Archive artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results-package
          path: Logs/*.xcresult.zip
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          xcode: true
          xcode_archive_path: Logs/ElementCallTests.xcresult

  # The one thing the package's own tests cannot reach. Everything about a gesture except whether
  # the touch arrives is covered in-process; a double tap declared correctly that something above
  # the tile claims first looks identical to a working one from inside, and only a real touch tells
  # them apart. The harness it drives is a sample app over the port fakes, so this needs no server
  # and no camera.
  #
  # A job of its own, sharded by test class, because it is the slow part: in one job after the
  # package tests, 54 tests ran for 18 minutes on top of a second 5-minute build, and the whole run
  # took half an hour. Each shard pays for its own build and simulator; the wall clock is the
  # longest shard. The shards are balanced by measured CI times, so a new test class goes in the
  # lightest one -- a class in no shard is never run, which is what the last step checks.
  ui-tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: chrome
            classes: ChromeVisibilityUITests AudioOutputUITests
          - shard: fullscreen
            classes: TileFullscreenUITests MinimizedCallUITests OverflowMenuUITests
          - shard: stage
            classes: SmallCallUITests StageScrollUITests ScrollPerformanceUITests RaisedHandUITests
          # The oldest iOS the package supports, for the chrome's taps only. SwiftUI arbitrates a
          # tap between a view and its parent differently there: iOS 18 gave the stage a tap on a
          # tile as well, and the chrome hid and came straight back, which no iOS 26 run could see.
          # Not a second copy of every shard: this is the class whose gestures overlap the most.
          - shard: chrome-ios18
            classes: ChromeVisibilityUITests
            ios: '18.6'
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && format('ui-tests-{0}-main-{1}', matrix.shard, github.sha) || format('ui-tests-{0}-{1}', matrix.shard, github.ref) }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail if a UI test class is in no shard
        env:
          SHARDED: ChromeVisibilityUITests AudioOutputUITests TileFullscreenUITests MinimizedCallUITests OverflowMenuUITests SmallCallUITests StageScrollUITests ScrollPerformanceUITests RaisedHandUITests
        run: |
          missing=0
          for class in $(sed -nE 's/^(final )?class ([A-Za-z0-9_]+UITests)[: ].*/\2/p' Example/ElementCallExampleUITests/*.swift); do
            case " $SHARDED " in
              *" $class "*) ;;
              *) echo "::error::$class is in no shard of the ui-tests job in tests.yml."; missing=1 ;;
            esac
          done
          exit $missing

      - name: Configure Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      # The same directory as the package job's cache, under its own key: this job builds the
      # example project, whose products live in a DerivedData folder the package job never makes.
      # The shards race to write it on a miss, and the losers only log a warning.
      - name: Cache build products
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: build-ui-${{ env.CACHE_VERSION }}-${{ env.XCODE_APP }}-${{ hashFiles('Package.resolved') }}

      - name: Install tools
        run: brew install xcodegen

      # The pinned runtime, or for a shard that names an older iOS, the newest of that major the
      # image has, and the named version downloaded if it has none. Picked before downloading: the
      # image's older runtimes change under us, and a download costs minutes on every run.
      - name: Create the simulator
        id: simulator
        env:
          IOS_VERSION: ${{ matrix.ios }}
        run: |
          runtime="$SIMULATOR_RUNTIME"
          if [ -n "$IOS_VERSION" ]; then
            major="${IOS_VERSION%%.*}"
            find_runtime() {
              xcrun simctl list runtimes -j | jq -r --arg v "$major." \
                '[.runtimes[] | select(.platform == "iOS" and .isAvailable and (.version | startswith($v)))] | last | .identifier // empty'
            }
            runtime=$(find_runtime)
            if [ -z "$runtime" ]; then
              xcodebuild -downloadPlatform iOS -buildVersion "$IOS_VERSION"
              runtime=$(find_runtime)
            fi
            [ -n "$runtime" ] || { echo "::error::No iOS $major simulator runtime on this image."; exit 1; }
          fi
          udid=$(xcrun simctl create "$SIMULATOR_LABEL" "$SIMULATOR_NAME" "$runtime")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Generate the example project
        working-directory: Example
        run: xcodegen generate

      # Retried, and only here: a real touch on a shared three-core runner is timing-dependent
      # however a test is written, and these ran about five times slower than on a Mac. The package
      # tests are not retried, because a flake there has been a real race more than once.
      - name: Run UI tests
        env:
          CLASSES: ${{ matrix.classes }}
        run: |
          only=()
          for class in $CLASSES; do only+=("-only-testing:ElementCallExampleUITests/$class"); done
          set -o pipefail && xcodebuild test \
            -project Example/ElementCallExample.xcodeproj \
            -scheme ElementCallExample \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            "${only[@]}" \
            -retry-tests-on-failure -test-iterations 3 \
            -resultBundlePath Logs/ElementCallExampleUITests.xcresult \
            | xcbeautify --renderer github-actions

      - name: Zip artifacts
        if: failure()
        run: |
          for bundle in Logs/*.xcresult; do
            [ -e "$bundle" ] && zip -r "$bundle.zip" "$bundle/"
          done

      - name: Archive artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results-ui-${{ matrix.shard }}
          path: Logs/*.xcresult.zip
          retention-days: 1
          if-no-files-found: ignore
